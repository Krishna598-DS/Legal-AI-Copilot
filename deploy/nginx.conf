# Reverse proxy for local/prod-like HTTPS termination.
# Place TLS certs in deploy/certs/ (fullchain.pem + privkey.pem) to enable 443.
# Without certs, use http://localhost:8080

upstream api_upstream {
    server api:8000;
}

upstream ui_upstream {
    server ui:8501;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://api_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api_upstream/openapi.json;
    }

    location /health {
        proxy_pass http://api_upstream/health;
    }

    location / {
        proxy_pass http://ui_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

