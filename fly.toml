# Fly.io free-tier friendly config (pay-as-you-go; often $0 within free allowance).
# Setup:
#   fly auth login
#   fly apps create legal-rag-free
#   fly secrets set OPENAI_API_KEY=... SECRET_KEY=... ADMIN_EMAILS=you@email.com
#   fly deploy
#
# Optional persistent SQLite (still free-allowance if small):
#   fly volumes create legal_data --size 1 --region ord
# Then uncomment [[mounts]] below.

app = "legal-rag-free"
primary_region = "ord"

[build]

[env]
  ENVIRONMENT = "production"
  DATABASE_URL = "sqlite:///./data/app.db"
  PYTHONPATH = "/app/backend"
  FRONTEND_DIR = "/app/frontend"
  REQUIRE_EMAIL_VERIFICATION = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# [[mounts]]
#   source = "legal_data"
#   destination = "/app/data"
