name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      ENVIRONMENT: testing
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      OPENAI_API_KEY: sk-ci-placeholder
      DATABASE_URL: sqlite:///./data/ci.db
      DATA_DIR: ${{ github.workspace }}/data
      FRONTEND_DIR: ${{ github.workspace }}/frontend
      LOG_TO_FILE: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Create runtime dirs
        run: mkdir -p data/uploads data/indexes logs frontend
      - name: Import app + route smoke
        run: python backend/scripts/smoke_api.py
      - name: Pytest
        run: pytest -q backend/tests --tb=short

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [web, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t legal-rag:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set."
            echo "Add it under Settings → Secrets → Actions (or Environments → production)."
            echo "Until then, rely on Render auto-deploy from GitHub."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy triggered."
