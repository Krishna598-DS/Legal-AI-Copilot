# Free Render blueprint — single web service (API + UI).
# Set OPENAI_API_KEY in the Render dashboard (sync: false).
# After first deploy, set APP_BASE_URL / FRONTEND_URL to the service URL.
# Do not set CORS_ORIGINS to a bare URL — omit it or use a JSON array.

services:
  - type: web
    name: legal-rag
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: PYTHONPATH
        value: /app/backend
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: krishnakishoregedela@gmail.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
