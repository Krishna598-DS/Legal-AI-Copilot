services:
  db:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag
      POSTGRES_DB: legalrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Free default: single API+UI service (SQLite)
  api:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      PYTHONPATH: /app/backend
      FRONTEND_DIR: /app/frontend
      APP_BASE_URL: http://localhost:8010
      FRONTEND_URL: http://localhost:8010
      ENVIRONMENT: production
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    command: bash backend/scripts/start.sh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Streamlit UI (profile: streamlit)
  ui:
    build: .
    profiles: ["streamlit"]
    ports:
      - "8510:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      PYTHONPATH: /app/backend
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run frontend/streamlit/app.py --server.address 0.0.0.0 --server.port 8501

  nginx:
    image: nginx:1.27-alpine
    profiles: ["full"]
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
  app_data:
  app_logs:
